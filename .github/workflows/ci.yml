name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test

      - name: Build
        run: cargo build

      - name: Example programs that must succeed
        run: |
          for f in 01_hello 02_read_file 05_verify 06_for_loop; do
            echo "== $f"
            ./target/debug/agentlang examples/$f.agl
          done

      - name: Example programs that must be refused
        run: |
          for f in 03_denied 04_retry 07_for_denied 09_fetch_denied; do
            echo "== $f (must fail)"
            if ./target/debug/agentlang examples/$f.agl; then
              echo "$f should have been refused"
              exit 1
            fi
          done

      - name: Benchmark harness on the reference solutions
        run: |
          python3 benchmark/run.py benchmark/solutions/reference \
            --bin target/debug/agentlang \
            --expect-python 10 --expect-agentlang 8
